<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#000000">
  <title>Hiring | Astute</title>
  <link rel="icon" type="image/png" href="/mark-32.png">
  <link rel="apple-touch-icon" href="/mark-180.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <main id="login-view" class="center-screen" hidden>
    <section class="card narrow">
      <img class="logo" src="/logo.png" alt="Astute" height="44">
      <p class="eyebrow">Hiring</p>
      <h1>Sign in</h1>
      <p class="muted">Use the User ID and password you were given.</p>
      <form id="login-form" novalidate>
        <label for="login-id">User ID or email</label>
        <input id="login-id" name="id" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required>
        <label for="login-pass">Password</label>
        <input id="login-pass" name="password" type="password" autocomplete="current-password" required>
        <p id="login-error" class="error" role="alert" hidden></p>
        <button class="btn primary block" id="login-btn" type="submit">Sign in</button>
      </form>
      
    </section>
  </main>

  <div id="app-view" hidden>
    <header class="topbar">
      <div class="brand">
        <img src="/logo-on-dark.png" alt="Astute" height="34">
        <span class="brand-sep" aria-hidden="true"></span>
        <span class="brand-name">Hiring</span>
      </div>
      <div class="topbar-right">
        <a class="toplink admin-only" href="/" hidden>Work tracker</a>
        <span id="who" class="small"></span>
        <button class="btn dark" id="logout-btn" type="button">Log out</button>
      </div>
    </header>

    <main class="page">
      <section id="candidate-view" hidden></section>

      <section id="denied" class="card denied" hidden>
        <h2>This account cannot open this page</h2>
        <p id="denied-msg" class="muted"></p>
        <p class="small muted">If you are a candidate, check your User ID and password with the person who invited you.</p>
      </section>

      <div id="content" hidden>
        <section class="stats" id="stats" aria-label="Summary"></section>

        <section class="toolbar" aria-label="Filters">
          <label class="visually-hidden" for="search">Search candidates</label>
          <input id="search" type="search" placeholder="Search by name, email, role or note" autocomplete="off">
          <label class="check"><input id="show-rejected" type="checkbox"> Show rejected</label>
          <button class="btn primary" id="add-btn" type="button">Add candidate</button>
        </section>

        <section id="board" class="board" aria-label="Candidate pipeline"></section>
        <p id="empty-hint" class="empty" hidden>No candidates yet. Use "Add candidate" to start the pipeline.</p>
      </div>
    </main>
  </div>

  <dialog id="drawer" aria-labelledby="drawer-title"></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <script type="module" src="app.js"></script>
</body>
</html>
